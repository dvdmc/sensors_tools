[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "sensors_tools"
authors = [{name = "David Morilla-Cabello", email = "davidmc@unizar.es"}]
readme="README.md"
requires-python=">=3.7.0"
version = "0.1.0"
dependencies=[
    "tqdm",
    "numpy",
    "matplotlib",
    "Pillow",
    "torchtyping",
    "pyyaml",
    "einops",
    "ftfy",
    "gdown",
    "regex",
    # Trident dependencies (check versions)
    "fsspec",
    "huggingface_hub",
    "nltk",
    "opencv_python",
    "openpyxl",
    "pycocotools",
    "safetensors",
    "scipy",
    "scikit-image",
    "timm",
    "transformers==4.37.2",
]
# TODO: Add optional dependency rospkg
# Indicate in readme: pip install torch torchvision torchaudio

[tool.setuptools]
packages = ["sensors_tools"]

[tool.ruff]
indent-width = 2
line-length = 120
